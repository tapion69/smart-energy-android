name: Build development prototypes

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'firmware/jk-esp32/**'
      - '.github/workflows/build-dev.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Android debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build Android debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug
      - name: Upload debug APK (not a release)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: smart-energy-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

  jk-esp32:
    name: ESP32 JK provisioning firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PlatformIO
        run: python -m pip install "platformio==6.1.18"
      - name: Compile firmware
        run: pio run -d firmware/jk-esp32
      - name: Upload firmware test binary (USB flash only)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: smart-jk-esp32-dev-usb
          path: firmware/jk-esp32/.pio/build/esp32dev/firmware.bin
          retention-days: 7
