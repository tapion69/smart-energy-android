name: Build development prototypes

on:
  push:
    branches: [main, dev]
    paths:
      - 'android/**'
      - 'firmware/jk-esp32/**'
      - '.github/workflows/build-dev.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  android:
    name: Android tests + permanently signed release APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # Pinned experimental Voltronic 0.3.4 OTA image from the known CI build.
      # No general-purpose firmware flasher and no unrelated firmware changes.
      - name: Fetch exact S3 OTA test binary for the APK
        uses: actions/download-artifact@v4
        with:
          name: SmartEnergy-VOLTRONIC-S3-OTA-0.3.3-PREFLIGHT
          run-id: 43585410799
          repository: tapion69/smart-energy-android
          github-token: ${{ github.token }}
          path: android/app/src/main/assets
      - name: Verify and embed the SHA256-pinned Voltronic test image
        shell: bash
        run: |
          set -euo pipefail
          cd android/app/src/main/assets
          echo '9cfc8c87280c50bf92eb4f6b8029ea67004aa79cfbe7ff0faa0f24f78e3bf289  smart-energy-voltronic-S3-OTA.bin' | sha256sum --check --status
          test "$(wc -c < smart-energy-voltronic-S3-OTA.bin)" -eq 901664
          mv smart-energy-voltronic-S3-OTA.bin voltronic-s3-0.3.4-test.bin
      - name: Load permanent APK signing key (GitHub secrets)
        id: signing
        shell: bash
        env:
          SE_KEYSTORE_B64: ${{ secrets.SMART_ENERGY_ANDROID_KEYSTORE_BASE64 }}
          SE_STORE_PASSWORD: ${{ secrets.SMART_ENERGY_ANDROID_STORE_PASSWORD }}
          SE_KEY_ALIAS: ${{ secrets.SMART_ENERGY_ANDROID_KEY_ALIAS }}
          SE_KEY_PASSWORD: ${{ secrets.SMART_ENERGY_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$SE_KEYSTORE_B64" || -z "$SE_STORE_PASSWORD" || -z "$SE_KEY_ALIAS" || -z "$SE_KEY_PASSWORD" ]]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Permanent APK signing not configured: set the 4 SMART_ENERGY_ANDROID_* GitHub secrets before distributing/installing future updates."
            exit 0
          fi
          printf '%s' "$SE_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/smart-energy-android-signing.jks"
          chmod 600 "$RUNNER_TEMP/smart-energy-android-signing.jks"
          echo "SMART_ENERGY_ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/smart-energy-android-signing.jks" >> "$GITHUB_ENV"
          echo "SMART_ENERGY_ANDROID_STORE_PASSWORD=$SE_STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "SMART_ENERGY_ANDROID_KEY_ALIAS=$SE_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "SMART_ENERGY_ANDROID_KEY_PASSWORD=$SE_KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "configured=true" >> "$GITHUB_OUTPUT"
      # Debug Android binaries use temporary keys on fresh GitHub runners.
      # Execute tests but NEVER distribute such APKs as upgrades.
      - name: Test Android code (debug tests are NOT distributed)
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Explain missing production signing
        if: steps.signing.outputs.configured != 'true'
        run: echo "::warning::No APK published. Run tools/android-migration/setup-permanent-signing.ps1 locally, then re-run workflow."
      - name: Build permanently signed APK (only when secrets configured)
        if: steps.signing.outputs.configured == 'true'
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease
      - name: Verify original permanent signing certificate (fail closed)
        if: steps.signing.outputs.configured == 'true'
        shell: bash
        env:
          EXPECTED_CERT: ${{ secrets.SMART_ENERGY_ANDROID_CERT_SHA256 }}
        run: |
          set -euo pipefail
          test -s android/app/build/outputs/apk/release/app-release.apk
          if [[ ! "$EXPECTED_CERT" =~ ^[A-Fa-f0-9]{64}$ ]]; then
            echo "::error::Missing permanent certificate fingerprint secret"
            exit 1
          fi
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          APK=android/app/build/outputs/apk/release/app-release.apk
          "$APKSIGNER" verify --verbose "$APK"
          # apksigner output wording can vary across SDK build-tools.
          # Only accept a 256-bit public certificate fingerprint.
          CERT_REPORT=$("$APKSIGNER" verify --print-certs "$APK")
          ACTUAL=$(printf '%s\n' "$CERT_REPORT" |
            grep -Eio '([[:xdigit:]]{2}:){31}[[:xdigit:]]{2}|[[:xdigit:]]{64}' |
            head -n 1 | tr -d ':' | tr '[:upper:]' '[:lower:]' || true)
          # Compute the expected digest independently from the PUBLIC
          # certificate stored alongside the private key. No private data is printed.
          KEYSTORE_CERT=$(keytool -exportcert -storetype PKCS12 \
            -keystore "$SMART_ENERGY_ANDROID_KEYSTORE_FILE" \
            -storepass "$SMART_ENERGY_ANDROID_STORE_PASSWORD" \
            -alias "$SMART_ENERGY_ANDROID_KEY_ALIAS" | sha256sum | awk '{print $1}')
          TRUSTED=$(printf '%s' "$EXPECTED_CERT" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')
          if [[ ! "$KEYSTORE_CERT" =~ ^[a-f0-9]{64}$ || ! "$ACTUAL" =~ ^[a-f0-9]{64}$ ]]; then
            echo "::error::Signing certificate digests missing/invalid (keystore or apksigner)"
            echo "apksigner public certificate output (for diagnosis only):"
            printf '%s\\n' "$CERT_REPORT"
            exit 1
          fi
          if [[ "$KEYSTORE_CERT" != "$TRUSTED" ]]; then
            echo "::error::Configured fingerprint differs from uploaded keystore certificate (check setup script)"
            exit 1
          fi
          if [[ "$ACTUAL" != "$KEYSTORE_CERT" ]]; then
            echo "::error::APK certificate does not match the permanent signing keystore certificate"
            exit 1
          fi
          echo "Permanent signing verified: APK certificate matches PKCS12 and configured fingerprint."
      - name: Upload signed release APK ONLY
        if: steps.signing.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: smart-energy-android-signed-upgradeable
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

  migration-backup-policy:
    name: Validate legacy backup excludes private credentials
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test nonsecret ADB settings extractor
        run: python -m unittest discover -s tools/android-migration -p 'test_*.py' -v

  jk-esp32:
    name: ESP32 JK provisioning firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PlatformIO
        run: python -m pip install "platformio==6.1.18"
      - name: Test JK02 pure C++ parser (synthetic fixtures)
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror firmware/jk-esp32/tests/test_protocol.cpp -o /tmp/smart-jk-protocol-test
          /tmp/smart-jk-protocol-test
          g++ -std=c++11 -Wall -Wextra -Werror firmware/jk-esp32/tests/test_extended.cpp -o /tmp/smart-jk-extended-test
          /tmp/smart-jk-extended-test
      - name: Verify BLE and settings schedule architecture
        run: |
          python firmware/jk-esp32/tests/test_ble_manager_architecture.py
          python firmware/jk-esp32/tests/test_settings_cadence.py
          g++ -std=c++11 -Wall -Wextra -Werror firmware/jk-esp32/tests/test_jk_identity_policy.cpp -o /tmp/test_jk_identity
          /tmp/test_jk_identity
          g++ -std=c++11 -Wall -Wextra -Werror firmware/jk-esp32/tests/test_ble_manager_policy.cpp -o /tmp/test_ble_manager
          /tmp/test_ble_manager
      - name: Compile firmware
        run: pio run -d firmware/jk-esp32
      - name: Create complete USB flash image (ESP32 classic only)
        run: |
          set -euo pipefail
          mkdir -p firmware/jk-esp32/dist
          FRAMEWORK="$HOME/.platformio/packages/framework-arduinoespressif32"
          TOOL="$HOME/.platformio/packages/tool-esptoolpy/esptool.py"
          python "$TOOL" --chip esp32 merge_bin \
            -o firmware/jk-esp32/dist/smart-jk-esp32-factory.bin \
            --flash_mode dio --flash_freq 40m --flash_size 4MB \
            0x1000 firmware/jk-esp32/.pio/build/esp32dev/bootloader.bin \
            0x8000 firmware/jk-esp32/.pio/build/esp32dev/partitions.bin \
            0xe000 "$FRAMEWORK/tools/partitions/boot_app0.bin" \
            0x10000 firmware/jk-esp32/.pio/build/esp32dev/firmware.bin
      - name: Upload complete factory image (offset 0x0)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: smart-jk-esp32-factory-0x0
          path: firmware/jk-esp32/dist/smart-jk-esp32-factory.bin
          retention-days: 7
      - name: Upload app-only binary (not for fresh ESP32 flash)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: smart-jk-esp32-app-only
          path: firmware/jk-esp32/.pio/build/esp32dev/firmware.bin
          retention-days: 7
