name: Publish verified Smart Energy Android 0.3.44 test release
on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/publish-android-0344.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish-verified-apk:
    name: Verify APK 0.3.44 and publish a GitHub prerelease
    runs-on: ubuntu-latest
    steps:
      - name: Download exact permanently signed APK from validated CI
        uses: actions/download-artifact@v4
        with:
          name: smart-energy-android-signed-upgradeable
          repository: tapion69/smart-energy-android
          run-id: 43621874608
          github-token: ${{ github.token }}
          path: release-files

      - name: Verify exact APK SHA256, signature and bundled S3 firmware
        shell: bash
        env:
          EXPECTED_CERT: ${{ secrets.SMART_ENERGY_ANDROID_CERT_SHA256 }}
        run: |
          set -euo pipefail
          APK=release-files/app-release.apk
          test -s "$APK"
          EXPECTED_APK_SHA=2d3a533719ad64aa640a37011d919e22f1b179514ee37dad1c3497e9bf164683
          printf '%s  %s\n' "$EXPECTED_APK_SHA" "$APK" | sha256sum --check --status
          EXPECTED_S3_SHA=9cfc8c87280c50bf92eb4f6b8029ea67004aa79cfbe7ff0faa0f24f78e3bf289
          ACTUAL_S3_SHA=$(unzip -p "$APK" assets/voltronic-s3-0.3.4-test.bin | sha256sum | awk '{print $1}')
          test "$ACTUAL_S3_SHA" = "$EXPECTED_S3_SHA"
          test "$(unzip -p "$APK" assets/voltronic-s3-0.3.4-test.bin | wc -c)" -eq 901664
          test "$EXPECTED_CERT" != ""
          [[ "$EXPECTED_CERT" =~ ^[[:xdigit:]]{64}$ ]]
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"
          CERT_REPORT=$("$APKSIGNER" verify --print-certs "$APK")
          ACTUAL_CERT=$(printf '%s\n' "$CERT_REPORT" |
            grep -Eio '([[:xdigit:]]{2}:){31}[[:xdigit:]]{2}|[[:xdigit:]]{64}' |
            head -n 1 | tr -d ':' | tr '[:upper:]' '[:lower:]' || true)
          TRUSTED_CERT=$(printf '%s' "$EXPECTED_CERT" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')
          test "$ACTUAL_CERT" = "$TRUSTED_CERT"
          echo "Verified Android 0.3.44 package, permanent signer and embedded S3 firmware."
          mv "$APK" release-files/SmartEnergy-Android-0.3.44.apk

      - name: Publish prerelease asset (no overwrite or new signing)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO=tapion69/smart-energy-android
          TAG=android-v0.3.44-test
          if gh release view "$TAG" --repo "$REPO" > /dev/null 2>&1; then
            echo "::error::Release tag already exists. Refusing to replace an installed APK."
            exit 1
          fi
          gh release create "$TAG" release-files/SmartEnergy-Android-0.3.44.apk \
            --repo "$REPO" \
            --target 9dab39082565633202c814f2460ed90108455ff1 \
            --title "Smart Energy Android 0.3.44 — Sunsynk + Moderne dashboards and Voltronic priorities" \
            --prerelease \
            --notes "Permanently signed Android 0.3.44-dev (versionCode 58). Upgrade over 0.3.43 without uninstalling, changing package, or losing configuration. JK battery cards sorted by numeric label (home only; original JK dashboard untouched). Both Modern and Sunsynk now show BMS pack power/current/mean voltage/actual battery probe temperature and inverter temperature/output current plus native daily AC load counter. Directional animated flows pause at zero W or missing data; battery reverses direction by signed JK power; grid flow requires verified direction. Modern swaps inverter/home positions. Yellow routine notices removed. QPIRI/QDOP raw uneditable fields removed from native edit picker; POP/PCP priority output/charge options are prominent and use the existing verified firmware write commands. MPPT derived VxI is labelled as calculated, never falsely claimed native. Inverter screen scroll handling improved. S3 OTA test image and JK firmware untouched."
          echo "Published GitHub prerelease $TAG with original verified signed APK."
