name: Smart Energy Android VPN Gateway (experimental)
on:
  push:
    branches: [experiment/esp32-vpn-gateway]
    paths:
      - 'android/**'
      - '.github/workflows/build-android-vpn.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Build experimental Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build offline APK (no personal tokens)
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug
      - name: Verify output
        run: test -s android/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: smart-energy-android-v0.2.2-vpn-debug-test
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
