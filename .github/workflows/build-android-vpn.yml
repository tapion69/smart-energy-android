name: Smart Energy Android VPN Gateway (experimental)
on:
  push:
    branches: [experiment/esp32-vpn-gateway, experiment/smart-energy-v0.3.0-multibms, experiment/smart-energy-v0.3.2-multibms-diagnostic, experiment/smart-energy-v0.3.5-ble-shared-discovery, experiment/smart-energy-v0.3.5-shared-gap-recovery, experiment/smart-energy-v0.3.5-single-ble-manager]
    paths:
      - 'android/**'
      - 'firmware/jk-esp32/**'
      - '.github/workflows/build-android-vpn.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Build experimental Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build offline APK (no personal tokens)
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug
      - name: Verify output
        run: test -s android/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: smart-energy-android-v0.3.5-single-ble-manager-debug-test
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

  jk-esp32:
    name: Test and build JK ESP32 0.3.5 (multi-BMS diagnostics, recovery; optional flash)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PlatformIO
        run: python -m pip install "platformio==6.1.18"
      - name: Test JK02 telemetry and identity parsers (synthetic safe frames)
        run: |
          set -euo pipefail
          g++ -std=c++11 -Wall -Wextra -Werror firmware/jk-esp32/tests/test_protocol.cpp -o /tmp/test-jk-protocol
          /tmp/test-jk-protocol
          g++ -std=c++11 -Wall -Wextra -Werror firmware/jk-esp32/tests/test_extended.cpp -o /tmp/test-jk-extended
          /tmp/test-jk-extended
          g++ -std=c++11 -Wall -Wextra -Werror firmware/jk-esp32/tests/test_write.cpp -o /tmp/test-jk-write
          /tmp/test-jk-write
          g++ -std=c++11 -Wall -Wextra -Werror firmware/jk-esp32/tests/test_setup_code_policy.cpp -o /tmp/test-jk-code-policy
          /tmp/test-jk-code-policy
          g++ -std=c++11 -Wall -Wextra -Werror firmware/jk-esp32/tests/test_boot_pair_policy.cpp -o /tmp/test-jk-boot-pair
          /tmp/test-jk-boot-pair
          g++ -std=c++11 -Wall -Wextra -Werror firmware/jk-esp32/tests/test_ble_manager_policy.cpp -o /tmp/test-jk-ble-manager
          /tmp/test-jk-ble-manager
          python firmware/jk-esp32/tests/test_ble_manager_architecture.py
          python firmware/jk-esp32/tests/test_json_ownership.py
      - name: Build classic ESP32 reader firmware
        run: pio run -d firmware/jk-esp32
      - name: Verify app-only image
        run: test -s firmware/jk-esp32/.pio/build/esp32dev/firmware.bin
      - name: Upload JK app-only firmware (no NVS erase)
        uses: actions/upload-artifact@v4
        with:
          name: smart-jk-esp32-v0.3.5-dev-APP-ONLY-offset-0x10000
          path: firmware/jk-esp32/.pio/build/esp32dev/firmware.bin
          retention-days: 14
      - name: Create full 0x0000 image for deliberate clean reinstall
        run: python firmware/jk-esp32/tools/build_full_flash.py
      - name: Verify clean-install factory image
        run: |
          python - <<'PY'
          from pathlib import Path
          f=Path("firmware/jk-esp32/.pio/build/esp32dev/smart_jk_esp32_v0.3.5_FULL_ERASE_FIRST_0x0000.bin")
          b=f.read_bytes()
          assert b[0x1000] == 0xe9 and b[0x10000] == 0xe9, "Missing bootloader/app"
          assert 0x10000 < len(b) < 0x400000, "Invalid ESP32 image size"
          print("Factory image verified:",len(b),"bytes")
          PY
      - name: Upload full factory reinstallation image (ESP1 only)
        uses: actions/upload-artifact@v4
        with:
          name: smart-jk-esp32-v0.3.5-COMPLETE-ERASE-FIRST-address-0x0000
          path: firmware/jk-esp32/.pio/build/esp32dev/smart_jk_esp32_v0.3.5_FULL_ERASE_FIRST_0x0000.bin
          retention-days: 14
