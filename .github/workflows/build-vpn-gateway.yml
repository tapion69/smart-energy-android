name: Smart Energy ESP32 VPN Gateway (experimental)
on:
  push:
    branches: [dev]
    paths:
      - 'firmware/vpn-gateway/**'
      - 'tools/windows-flasher/**'
      - 'firmware/jk-esp32/**'
      - '.github/workflows/build-vpn-gateway.yml'
  workflow_dispatch:

jobs:
  policy:
    name: VPN routing and security policy tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Host security regression tests
        run: |
          cc -std=gnu11 -Wall -Wextra -Werror \
            firmware/vpn-gateway/tests/test_policy.c \
            -o /tmp/se-gateway-policy
          /tmp/se-gateway-policy

  esp32:
    name: Build isolated classic ESP32 VPN gateway
    needs: policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned TailTiny v3.1.0 components (experimental)
        run: |
          git clone --quiet https://github.com/Asimmimx/tailtiny.git /tmp/tailtiny
          git -C /tmp/tailtiny checkout --detach d1ec2ae45e252e8dc737452be0f6afe1ac2e3edb
          mkdir -p firmware/vpn-gateway/components
          cp -a /tmp/tailtiny/components/tailtiny firmware/vpn-gateway/components/
          echo "TailTiny pinned commit: $(git -C /tmp/tailtiny rev-parse HEAD)"
      - name: ESP-IDF 5.3.2 build (no customer credentials)
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.3.2
          target: esp32
          path: firmware/vpn-gateway
      - name: Verify firmware image and flash offsets
        run: |
          test -s firmware/vpn-gateway/build/smart_energy_vpn_gateway.bin
          test -s firmware/vpn-gateway/build/bootloader/bootloader.bin
          test -s firmware/vpn-gateway/build/partition_table/partition-table.bin
          test -s firmware/vpn-gateway/build/flasher_args.json
      - name: Produce public precompiled USB provisioning images (classic ESP32)
        run: |
          python -m pip install "esptool==4.9.0"
          # ESP-IDF Docker builds as root; output into a runner-owned dist dir.
          mkdir -p firmware/vpn-gateway/dist
          cp firmware/vpn-gateway/build/smart_energy_vpn_gateway.bin \
            firmware/vpn-gateway/dist/smart-energy-vpn-USB-APP-ESP32-0x10000.bin
          python -m esptool --chip esp32 merge_bin \
            --flash_mode dio --flash_freq 40m --flash_size 4MB \
            -o firmware/vpn-gateway/dist/smart-energy-vpn-USB-FACTORY-ESP32-0x0.bin \
            0x1000 firmware/vpn-gateway/build/bootloader/bootloader.bin \
            0x8000 firmware/vpn-gateway/build/partition_table/partition-table.bin \
            0x10000 firmware/vpn-gateway/build/smart_energy_vpn_gateway.bin
          test -s firmware/vpn-gateway/dist/smart-energy-vpn-USB-FACTORY-ESP32-0x0.bin
      - name: Upload public generic firmware images (no user credentials)
        uses: actions/upload-artifact@v4
        with:
          name: SmartEnergy-VPN-ESP32-USB-PRECOMPILED
          path: |
            firmware/vpn-gateway/dist/smart-energy-vpn-USB-FACTORY-ESP32-0x0.bin
            firmware/vpn-gateway/dist/smart-energy-vpn-USB-APP-ESP32-0x10000.bin
          if-no-files-found: error
          retention-days: 30

  jk:
    name: Build classic ESP32 JK firmware for all-in-one installer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile known-good JK ESP32 firmware
        run: |
          python -m pip install "platformio==6.1.18"
          python firmware/jk-esp32/tests/test_ble_manager_architecture.py
          python firmware/jk-esp32/tests/test_settings_cadence.py
          g++ -std=c++11 -Wall -Wextra -Werror firmware/jk-esp32/tests/test_jk_identity_policy.cpp -o /tmp/test_jk_identity
          /tmp/test_jk_identity
          pio run -d firmware/jk-esp32
      - name: Prepare factory and app-only JK binaries
        run: |
          set -euo pipefail
          mkdir -p firmware/jk-esp32/dist
          FRAMEWORK="$HOME/.platformio/packages/framework-arduinoespressif32"
          TOOL="$HOME/.platformio/packages/tool-esptoolpy/esptool.py"
          python "$TOOL" --chip esp32 merge_bin \
            -o firmware/jk-esp32/dist/smart-jk-esp32-factory.bin \
            --flash_mode dio --flash_freq 40m --flash_size 4MB \
            0x1000 firmware/jk-esp32/.pio/build/esp32dev/bootloader.bin \
            0x8000 firmware/jk-esp32/.pio/build/esp32dev/partitions.bin \
            0xe000 "$FRAMEWORK/tools/partitions/boot_app0.bin" \
            0x10000 firmware/jk-esp32/.pio/build/esp32dev/firmware.bin
          cp firmware/jk-esp32/.pio/build/esp32dev/firmware.bin \
            firmware/jk-esp32/dist/smart-jk-esp32-app-only.bin
          test -s firmware/jk-esp32/dist/smart-jk-esp32-factory.bin
          test -s firmware/jk-esp32/dist/smart-jk-esp32-app-only.bin
      - uses: actions/upload-artifact@v4
        with:
          name: SmartEnergy-JK-ESP32-USB-PRECOMPILED
          path: |
            firmware/jk-esp32/dist/smart-jk-esp32-factory.bin
            firmware/jk-esp32/dist/smart-jk-esp32-app-only.bin
          if-no-files-found: error
          retention-days: 30

  windows-bundle:
    name: Build all-in-one Windows flasher with JK and VPN firmwares
    needs: [esp32, jk]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: SmartEnergy-VPN-ESP32-USB-PRECOMPILED
          path: firmware/vpn-gateway/dist
      - uses: actions/download-artifact@v4
        with:
          name: SmartEnergy-JK-ESP32-USB-PRECOMPILED
          path: firmware/jk-esp32/dist
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned packaging tools
        shell: pwsh
        run: python -m pip install "pyinstaller==6.16.0" "esptool==4.9.0" "pyserial==3.5"
      - name: Test USB and flash safeguards
        shell: pwsh
        working-directory: tools/windows-flasher
        run: python -m unittest discover -p "test_*.py" -v
      - name: Package one EXE with both JK and VPN factory/update firmwares
        shell: pwsh
        run: |
          python -m PyInstaller --clean --noconfirm --onefile --windowed --name SmartEnergyFlasher --collect-all esptool --hidden-import serial.tools.list_ports --add-data "firmware/vpn-gateway/dist/smart-energy-vpn-USB-FACTORY-ESP32-0x0.bin;embedded_firmware" --add-data "firmware/vpn-gateway/dist/smart-energy-vpn-USB-APP-ESP32-0x10000.bin;embedded_firmware" --add-data "firmware/jk-esp32/dist/smart-jk-esp32-factory.bin;embedded_firmware" --add-data "firmware/jk-esp32/dist/smart-jk-esp32-app-only.bin;embedded_firmware" tools/windows-flasher/smart_energy_flasher.py
          if ((Get-Item "dist/SmartEnergyFlasher.exe").Length -lt 3000000) { throw "All-in-one Windows EXE suspiciously small" }
      - name: Upload all-in-one Windows flasher
        uses: actions/upload-artifact@v4
        with:
          name: SmartEnergyFlasher-Windows-AllInOne-JK-VPN
          path: dist/SmartEnergyFlasher.exe
          retention-days: 30
