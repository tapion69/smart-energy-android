name: Smart Energy ESP32 VPN Gateway (experimental)
on:
  push:
    branches: [dev, 'feature/universal-reader-discovery-20261116', 'feature/names-only-signed-android-20261116', 'fix/jk-discovery-pairing-20261116', 'feature/ble-wifi-recovery-universal-20261118', 'feature/vpn-s3-ota-app-20261118', 'fix/jk-voltronic-ota-migration-20261118']
    paths:
      - 'firmware/vpn-gateway/**'
      - 'firmware/voltronic-esp32/**'
      - 'firmware/deye-esp32/**'
      - 'tools/windows-flasher/**'
      - 'firmware/jk-esp32/**'
      - '.github/workflows/build-vpn-gateway.yml'
  workflow_dispatch:

# Avoid wasting runners on obsolete intermediate BLE patches.
concurrency:
  group: smart-energy-ble-firmware-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: VPN routing and security policy tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Host security regression tests
        run: |
          cc -std=gnu11 -Wall -Wextra -Werror \
            firmware/vpn-gateway/tests/test_policy.c \
            -o /tmp/se-gateway-policy
          /tmp/se-gateway-policy
      - name: Confirm VPN writes need only the authenticated APK confirmation
        run: python firmware/vpn-gateway/tests/test_confirmed_write_policy.py
      - name: Verify ESP32-S3 CH343 and native USB provisioning sources
        run: python firmware/vpn-gateway/tests/test_s3_provisioning_sources.py
      - name: Verify Voltronic-only USB addition preserves NVS
        run: python firmware/vpn-gateway/tests/test_voltronic_patch_sources.py
      - name: Verify OTA preflight keeps rollback, SHA256 and existing polling
        run: python firmware/voltronic-esp32/tests/test_ota_preflight_sources.py

  esp32:
    name: Build isolated classic ESP32 VPN gateway
    needs: policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned TailTiny v3.1.0 components (experimental)
        run: |
          git clone --quiet https://github.com/Asimmimx/tailtiny.git /tmp/tailtiny
          git -C /tmp/tailtiny checkout --detach d1ec2ae45e252e8dc737452be0f6afe1ac2e3edb
          mkdir -p firmware/vpn-gateway/components
          cp -a /tmp/tailtiny/components/tailtiny firmware/vpn-gateway/components/
          echo "TailTiny pinned commit: $(git -C /tmp/tailtiny rev-parse HEAD)"
      - name: ESP-IDF 5.3.2 build (no customer credentials)
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.3.2
          target: esp32
          path: firmware/vpn-gateway
      - name: Verify firmware image and flash offsets
        run: |
          test -s firmware/vpn-gateway/build/smart_energy_vpn_gateway.bin
          test -s firmware/vpn-gateway/build/bootloader/bootloader.bin
          test -s firmware/vpn-gateway/build/partition_table/partition-table.bin
          test -s firmware/vpn-gateway/build/flasher_args.json
      - name: Produce public precompiled USB provisioning images (classic ESP32)
        run: |
          python -m pip install "esptool==4.9.0"
          # ESP-IDF Docker builds as root; output into a runner-owned dist dir.
          mkdir -p firmware/vpn-gateway/dist
          cp firmware/vpn-gateway/build/smart_energy_vpn_gateway.bin \
            firmware/vpn-gateway/dist/smart-energy-vpn-USB-APP-ESP32-0x10000.bin
          python -m esptool --chip esp32 merge_bin \
            --flash_mode dio --flash_freq 40m --flash_size 4MB \
            -o firmware/vpn-gateway/dist/smart-energy-vpn-USB-FACTORY-ESP32-0x0.bin \
            0x1000 firmware/vpn-gateway/build/bootloader/bootloader.bin \
            0x8000 firmware/vpn-gateway/build/partition_table/partition-table.bin \
            0x10000 firmware/vpn-gateway/build/smart_energy_vpn_gateway.bin
          test -s firmware/vpn-gateway/dist/smart-energy-vpn-USB-FACTORY-ESP32-0x0.bin
      - name: Upload public generic firmware images (no user credentials)
        uses: actions/upload-artifact@v4
        with:
          name: SmartEnergy-VPN-ESP32-USB-PRECOMPILED
          path: |
            firmware/vpn-gateway/dist/smart-energy-vpn-USB-FACTORY-ESP32-0x0.bin
            firmware/vpn-gateway/dist/smart-energy-vpn-USB-APP-ESP32-0x10000.bin
          if-no-files-found: error
          retention-days: 30

  esp32s3:
    name: Build ESP32-S3 N16R8 VPN USB prototype
    needs: policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned TailTiny v3.1.0 components
        run: |
          git clone --quiet https://github.com/Asimmimx/tailtiny.git /tmp/tailtiny
          git -C /tmp/tailtiny checkout --detach d1ec2ae45e252e8dc737452be0f6afe1ac2e3edb
          mkdir -p firmware/vpn-gateway/components
          cp -a /tmp/tailtiny/components/tailtiny firmware/vpn-gateway/components/
      - name: ESP-IDF 5.3.2 build — ESP32-S3 N16R8 (no customer secrets)
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.3.2
          target: esp32s3
          path: firmware/vpn-gateway
      - name: Verify target and 16 MB flash / 8 MB octal PSRAM profile
        run: |
          set -euo pipefail
          test -s firmware/vpn-gateway/build/smart_energy_vpn_gateway.bin
          test -s firmware/vpn-gateway/build/bootloader/bootloader.bin
          test -s firmware/vpn-gateway/build/partition_table/partition-table.bin
          grep -q '^CONFIG_IDF_TARGET_ESP32S3=y' firmware/vpn-gateway/sdkconfig
          grep -q '^CONFIG_ESPTOOLPY_FLASHSIZE_16MB=y' firmware/vpn-gateway/sdkconfig
          grep -q '^CONFIG_SPIRAM_MODE_OCT=y' firmware/vpn-gateway/sdkconfig
          grep -q '^CONFIG_PARTITION_TABLE_CUSTOM=y' firmware/vpn-gateway/sdkconfig
          grep -q '^CONFIG_BOOTLOADER_APP_ROLLBACK_ENABLE=y' firmware/vpn-gateway/sdkconfig
          test -s firmware/vpn-gateway/partitions_s3_ota.csv
          python firmware/vpn-gateway/tests/test_vpn_s3_ota_sources.py
      - name: Package S3 factory (bootloader at 0x0) and app-only (0x10000)
        run: |
          set -euo pipefail
          python -m pip install "esptool==4.9.0"
          mkdir -p firmware/vpn-gateway/dist-s3
          cp firmware/vpn-gateway/build/smart_energy_vpn_gateway.bin \
            firmware/vpn-gateway/dist-s3/smart-energy-vpn-USB-APP-ESP32S3-N16R8-0x10000.bin
          cp firmware/vpn-gateway/build/smart_energy_vpn_gateway.bin \
            firmware/vpn-gateway/dist-s3/SmartEnergy-VPN-S3-OTA.bin
          cp firmware/vpn-gateway/build/bootloader/bootloader.bin \
            firmware/vpn-gateway/dist-s3/vpn-s3-ota-bootloader.bin
          cp firmware/vpn-gateway/build/partition_table/partition-table.bin \
            firmware/vpn-gateway/dist-s3/vpn-s3-ota-partition-table.bin
          python -m esptool --chip esp32s3 merge_bin \
            --flash_mode dio --flash_freq 40m --flash_size 16MB \
            -o firmware/vpn-gateway/dist-s3/smart-energy-vpn-USB-FACTORY-ESP32S3-N16R8-0x0.bin \
            0x0 firmware/vpn-gateway/build/bootloader/bootloader.bin \
            0x8000 firmware/vpn-gateway/build/partition_table/partition-table.bin \
            0x10000 firmware/vpn-gateway/build/smart_energy_vpn_gateway.bin
          test -s firmware/vpn-gateway/dist-s3/smart-energy-vpn-USB-FACTORY-ESP32S3-N16R8-0x0.bin
      - name: Upload generic ESP32-S3 VPN proof-of-concept images
        uses: actions/upload-artifact@v4
        with:
          name: SmartEnergy-VPN-ESP32S3-N16R8-USB-PRECOMPILED
          path: |
            firmware/vpn-gateway/dist-s3/smart-energy-vpn-USB-FACTORY-ESP32S3-N16R8-0x0.bin
            firmware/vpn-gateway/dist-s3/smart-energy-vpn-USB-APP-ESP32S3-N16R8-0x10000.bin
          if-no-files-found: error
          retention-days: 30
      - name: Upload S3 OTA candidate + guarded USB migration components
        uses: actions/upload-artifact@v4
        with:
          name: SmartEnergy-VPN-S3-OTA-CANDIDATE
          path: |
            firmware/vpn-gateway/dist-s3/SmartEnergy-VPN-S3-OTA.bin
            firmware/vpn-gateway/dist-s3/vpn-s3-ota-bootloader.bin
            firmware/vpn-gateway/dist-s3/vpn-s3-ota-partition-table.bin
          if-no-files-found: error
          retention-days: 30

  jk:
    name: Build classic ESP32 JK firmware for all-in-one installer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile known-good JK ESP32 firmware
        run: |
          python -m pip install "platformio==6.1.18"
          python firmware/jk-esp32/tests/test_ble_manager_architecture.py
          python firmware/jk-esp32/tests/test_settings_cadence.py
          python firmware/jk-esp32/tests/test_wifi_recovery_architecture.py
          g++ -std=c++11 -Wall -Wextra -Werror firmware/jk-esp32/tests/test_jk_identity_policy.cpp -o /tmp/test_jk_identity
          /tmp/test_jk_identity
          pio run -d firmware/jk-esp32
      - name: Prepare factory and app-only JK binaries
        run: |
          set -euo pipefail
          mkdir -p firmware/jk-esp32/dist
          FRAMEWORK="$HOME/.platformio/packages/framework-arduinoespressif32"
          TOOL="$HOME/.platformio/packages/tool-esptoolpy/esptool.py"
          python "$TOOL" --chip esp32 merge_bin \
            -o firmware/jk-esp32/dist/smart-jk-esp32-factory.bin \
            --flash_mode dio --flash_freq 40m --flash_size 4MB \
            0x1000 firmware/jk-esp32/.pio/build/esp32dev/bootloader.bin \
            0x8000 firmware/jk-esp32/.pio/build/esp32dev/partitions.bin \
            0xe000 "$FRAMEWORK/tools/partitions/boot_app0.bin" \
            0x10000 firmware/jk-esp32/.pio/build/esp32dev/firmware.bin
          cp firmware/jk-esp32/.pio/build/esp32dev/firmware.bin \
            firmware/jk-esp32/dist/smart-jk-esp32-app-only.bin
          test -s firmware/jk-esp32/dist/smart-jk-esp32-factory.bin
          test -s firmware/jk-esp32/dist/smart-jk-esp32-app-only.bin
      - uses: actions/upload-artifact@v4
        with:
          name: SmartEnergy-JK-ESP32-USB-PRECOMPILED
          path: |
            firmware/jk-esp32/dist/smart-jk-esp32-factory.bin
            firmware/jk-esp32/dist/smart-jk-esp32-app-only.bin
          if-no-files-found: error
          retention-days: 30

  publish-jk-ota-0316:
    name: Publish opt-in JK 0.3.16 OTA after signed APK
    if: github.ref == 'refs/heads/fix/jk-voltronic-ota-migration-20261118'
    needs: [policy, jk]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: SmartEnergy-JK-ESP32-USB-PRECOMPILED
          path: verified-jk
      - name: Verify JK firmware version, chip, and signed APK floor
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BIN=verified-jk/smart-jk-esp32-app-only.bin
          test -s "$BIN"
          grep -Fq 'static const char *VERSION = "0.3.16-dev-ota-recovery";' firmware/jk-esp32/src/main.cpp
          strings "$BIN" | grep -Fq '0.3.16-dev-ota-recovery'
          python - <<'PY'
          from pathlib import Path
          b=Path("verified-jk/smart-jk-esp32-app-only.bin").read_bytes()
          if not (16384<=len(b)<=0x140000 and b[0]==0xe9 and b[12:14]==b'\x00\x00'):
              raise SystemExit("JK OTA binary invalid or wrong ESP32 chip")
          print("Valid classic ESP32 JK OTA image: %d bytes" % len(b))
          PY
          gh api "repos/$GITHUB_REPOSITORY/contents/updates/android.json?ref=main" >/tmp/official-apk-feed.json
          python - <<'PY'
          import base64,json
          raw=json.load(open("/tmp/official-apk-feed.json"))
          feed=json.loads(base64.b64decode(raw["content"]))
          if feed.get("versionCode",0)<78:
              raise SystemExit("Signed Android 0.3.64 not yet published; refusing JK OTA feed")
          PY
      - name: Publish reviewed JK firmware and exact SHA-256 manifest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=jk-v0.3.16
          SRC=verified-jk/smart-jk-esp32-app-only.bin
          DEST=smart-jk-esp32-ota.bin
          cp "$SRC" "$DEST"
          HASH=$(sha256sum "$DEST" | cut -d' ' -f1)
          export TAG HASH
          gh api "repos/$GITHUB_REPOSITORY/contents/updates/jk-esp32.json?ref=main" > /tmp/jk-feed-before.json
          # A repeat build is NOT byte-identical (toolchain timestamps/metadata).
          # Never replace a published release, compare the published artifact
          # against the canonical manifest, then exit successfully.
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            mkdir -p /tmp/existing-jk-ota
            gh release download "$TAG" -R "$GITHUB_REPOSITORY" \
              --pattern "$DEST" --dir /tmp/existing-jk-ota
            test -s "/tmp/existing-jk-ota/$DEST"
            CHECKED_SHA=$(sha256sum "/tmp/existing-jk-ota/$DEST" | cut -d' ' -f1)
            export CHECKED_SHA
            python - <<'PY'
          import os,json,base64
          raw=json.load(open("/tmp/jk-feed-before.json"))
          feed=json.loads(base64.b64decode(raw["content"]))
          expected_url="https://github.com/tapion69/smart-energy-android/releases/download/jk-v0.3.16/smart-jk-esp32-ota.bin"
          if not (feed.get("available") is True and
                  feed.get("product")=="smart-jk-esp32" and
                  feed.get("version")=="0.3.16" and
                  feed.get("downloadUrl")==expected_url and
                  feed.get("sha256")==os.environ["CHECKED_SHA"]):
              raise SystemExit("Existing JK release/manifest SHA256 mismatch; manual review required")
          print("Existing JK OTA release verified. No replacement or duplicate publication.")
          PY
            exit 0
          fi

          python - <<'PY'
          import json,base64
          raw=json.load(open("/tmp/jk-feed-before.json"))
          feed=json.loads(base64.b64decode(raw["content"]))
          if feed.get("available",False) and feed.get("version")!="0.3.16":
              raise SystemExit("A different JK OTA release is published: manual review required")
          PY
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists; existing GitHub asset must match manifest"
          else
            gh release create "$TAG" "$DEST" \
              -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "Smart Energy JK 0.3.16 · optional OTA" \
              --notes "Experimental opt-in JK 0.3.16: same BMS/BLE manager as 0.3.15 with OTA release-version bump. Eligible dual_ota readers may install over local Wi-Fi through signed Android 0.3.64 after explicit user confirmation and SHA-256 validation. First test on one non-critical JK reader. Never automatically flash."
          fi
          python - <<'PY'
          import os,json,base64
          raw=json.load(open("/tmp/jk-feed-before.json"))
          feed=json.loads(base64.b64decode(raw["content"]))
          if feed.get("available") and feed.get("version")=="0.3.16":
              if feed.get("sha256")!=os.environ["HASH"]:
                  raise SystemExit("Existing JK release digest mismatch")
              print("Existing JK manifest digest verified")
              raise SystemExit(0)
          tag=os.environ["TAG"]
          m={
            "schemaVersion":1,"product":"smart-jk-esp32","available":True,
            "version":"0.3.16","hardwareTargets":["esp32dev"],
            "downloadUrl":"https://github.com/tapion69/smart-energy-android/releases/download/"+tag+"/smart-jk-esp32-ota.bin",
            "sha256":os.environ["HASH"],
            "releaseNotesUrl":"https://github.com/tapion69/smart-energy-android/releases/tag/"+tag
          }
          p={"message":"chore(jk): enable user-confirmed 0.3.16 SHA256 OTA",
             "content":base64.b64encode((json.dumps(m,indent=2)+"\n").encode()).decode(),
             "sha":raw["sha"],"branch":"main"}
          open("/tmp/jk-publish.json","w").write(json.dumps(p))
          PY
          gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/updates/jk-esp32.json" \
            --input /tmp/jk-publish.json
          echo "Official JK OTA 0.3.16 available for local confirmed update"

  voltronic-s3:
    name: Compile Voltronic ESP32-S3 read-only image for Windows bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify whitelist, CRC and parsers before bundling
        run: |
          gcc -std=gnu11 -Wall -Wextra -Werror \
            firmware/voltronic-esp32/tests/test_protocol.c \
            -o /tmp/se-voltronic-protocol -lm
          /tmp/se-voltronic-protocol
      - name: ESP-IDF 5.3.2 ESP32-S3 build
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.3.2
          target: esp32s3
          path: firmware/voltronic-esp32
      - name: Produce Voltronic S3 read-only factory / app-only images
        run: |
          set -euo pipefail
          python -m pip install "esptool==4.9.0"
          mkdir -p firmware/voltronic-esp32/dist
          cp firmware/voltronic-esp32/build/smart_energy_voltronic_s3.bin \
            firmware/voltronic-esp32/dist/smart-energy-voltronic-S3-APP-0x10000.bin
          python -m esptool --chip esp32s3 merge_bin \
            --flash_mode dio --flash_freq 40m --flash_size 16MB \
            -o firmware/voltronic-esp32/dist/smart-energy-voltronic-S3-FACTORY-0x0.bin \
            0x0 firmware/voltronic-esp32/build/bootloader/bootloader.bin \
            0x8000 firmware/voltronic-esp32/build/partition_table/partition-table.bin \
            0x10000 firmware/voltronic-esp32/build/smart_energy_voltronic_s3.bin
      - uses: actions/upload-artifact@v4
        with:
          name: SmartEnergy-VOLTRONIC-ESP32S3-N16R8-READONLY
          path: |
            firmware/voltronic-esp32/dist/smart-energy-voltronic-S3-FACTORY-0x0.bin
            firmware/voltronic-esp32/dist/smart-energy-voltronic-S3-APP-0x10000.bin
          if-no-files-found: error
          retention-days: 30

  voltronic-s3-ota:
    name: Build guarded dual-OTA Voltronic S3 migration images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set OTA-only sdkconfig for THIS build
        run: |
          cp firmware/voltronic-esp32/sdkconfig.ota.defaults firmware/voltronic-esp32/sdkconfig
          grep -q '^CONFIG_PARTITION_TABLE_CUSTOM=y' firmware/voltronic-esp32/sdkconfig
          grep -q '^CONFIG_PARTITION_TABLE_CUSTOM_FILENAME="partitions_ota.csv"' firmware/voltronic-esp32/sdkconfig
      - name: ESP-IDF 5.3.2 custom dual-OTA layout
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.3.2
          target: esp32s3
          path: firmware/voltronic-esp32
          command: idf.py -B build_ota build
      - name: Verify safe partitions and package separate-offset images
        run: |
          set -euo pipefail
          mkdir -p firmware/voltronic-esp32/dist-ota
          cp firmware/voltronic-esp32/build_ota/bootloader/bootloader.bin firmware/voltronic-esp32/dist-ota/voltronic-s3-ota-bootloader.bin
          cp firmware/voltronic-esp32/build_ota/partition_table/partition-table.bin firmware/voltronic-esp32/dist-ota/voltronic-s3-ota-partition-table.bin
          cp firmware/voltronic-esp32/build_ota/smart_energy_voltronic_s3.bin firmware/voltronic-esp32/dist-ota/voltronic-s3-ota-app.bin
          cp firmware/voltronic-esp32/build_ota/smart_energy_voltronic_s3.bin firmware/voltronic-esp32/dist-ota/smart-energy-voltronic-S3-OTA.bin
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, "tools/windows-flasher")
          from voltronic_ota_migration import validate_migration_images
          from voltronic_ota_migration import EXPECTED,parse_partition_table
          actual=parse_partition_table(Path("firmware/voltronic-esp32/dist-ota/voltronic-s3-ota-partition-table.bin").read_bytes())
          print("Build partition table:",actual,flush=True)
          print("Expected safe table:",EXPECTED,flush=True)
          b,t,a=validate_migration_images(Path("firmware/voltronic-esp32/dist-ota"))
          print("USB migration safe partition ranges:", b.stat().st_size, t.stat().st_size, a.stat().st_size)
          PY
          grep '^CONFIG_PARTITION_TABLE' firmware/voltronic-esp32/sdkconfig || true
          grep -q '^CONFIG_PARTITION_TABLE_CUSTOM=y' firmware/voltronic-esp32/sdkconfig
      - name: Publish NON-MERGED USB migration images
        uses: actions/upload-artifact@v4
        with:
          name: SmartEnergy-VOLTRONIC-S3-OTA-MIGRATION
          path: firmware/voltronic-esp32/dist-ota/voltronic-s3-ota-*.bin
          if-no-files-found: error
          retention-days: 30
      - name: Upload experimental app-only OTA file for user-controlled GitHub release
        uses: actions/upload-artifact@v4
        with:
          name: SmartEnergy-VOLTRONIC-S3-OTA-0.3.3-PREFLIGHT
          path: firmware/voltronic-esp32/dist-ota/smart-energy-voltronic-S3-OTA.bin
          if-no-files-found: error
          retention-days: 30

  deye-s3:
    name: Compile Deye ESP32-S3 Solarman V5 field-test and dual OTA images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test protocol and OTA source protections
        run: |
          gcc -std=gnu11 -Wall -Wextra -Werror firmware/deye-esp32/tests/test_protocol.c -o /tmp/deye-protocol
          /tmp/deye-protocol
          python firmware/deye-esp32/tests/test_source_guards.py
          python -m py_compile tools/windows-flasher/deye_usb.py
      - name: ESP-IDF 5.3.2 ESP32-S3 N16R8 build
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.3.2
          target: esp32s3
          path: firmware/deye-esp32
      - name: Package generic Deye images with mandatory dual-OTA partitions
        run: |
          set -euo pipefail
          python -m pip install "esptool==4.9.0"
          mkdir -p firmware/deye-esp32/dist
          grep -q '^CONFIG_PARTITION_TABLE_CUSTOM=y' firmware/deye-esp32/sdkconfig
          test -s firmware/deye-esp32/build/bootloader/bootloader.bin
          test -s firmware/deye-esp32/build/partition_table/partition-table.bin
          test -s firmware/deye-esp32/build/smart_energy_deye_s3.bin
          cp firmware/deye-esp32/build/smart_energy_deye_s3.bin firmware/deye-esp32/dist/smart-energy-deye-S3-APP-0x10000.bin
          python -m esptool --chip esp32s3 merge_bin --flash_mode dio --flash_freq 40m --flash_size 16MB             -o firmware/deye-esp32/dist/smart-energy-deye-S3-FACTORY-0x0.bin             0x0 firmware/deye-esp32/build/bootloader/bootloader.bin             0x8000 firmware/deye-esp32/build/partition_table/partition-table.bin             0x10000 firmware/deye-esp32/build/smart_energy_deye_s3.bin
          test -s firmware/deye-esp32/dist/smart-energy-deye-S3-FACTORY-0x0.bin
      - uses: actions/upload-artifact@v4
        with:
          name: SmartEnergy-DEYE-ESP32S3-N16R8-EXPERIMENTAL
          path: |
            firmware/deye-esp32/dist/smart-energy-deye-S3-FACTORY-0x0.bin
            firmware/deye-esp32/dist/smart-energy-deye-S3-APP-0x10000.bin
          if-no-files-found: error
          retention-days: 30

  windows-bundle:
    name: Build all-in-one Windows flasher with JK/VPN/S3 Voltronic
    needs: [esp32, esp32s3, jk, voltronic-s3, voltronic-s3-ota, deye-s3]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: SmartEnergy-VPN-ESP32-USB-PRECOMPILED
          path: firmware/vpn-gateway/dist
      - uses: actions/download-artifact@v4
        with:
          name: SmartEnergy-JK-ESP32-USB-PRECOMPILED
          path: firmware/jk-esp32/dist
      - uses: actions/download-artifact@v4
        with:
          name: SmartEnergy-VPN-ESP32S3-N16R8-USB-PRECOMPILED
          path: firmware/vpn-gateway/dist-s3
      - uses: actions/download-artifact@v4
        with:
          name: SmartEnergy-VOLTRONIC-ESP32S3-N16R8-READONLY
          path: firmware/voltronic-esp32/dist
      - uses: actions/download-artifact@v4
        with:
          name: SmartEnergy-VOLTRONIC-S3-OTA-MIGRATION
          path: firmware/voltronic-esp32/dist-ota
      - uses: actions/download-artifact@v4
        with:
          name: SmartEnergy-DEYE-ESP32S3-N16R8-EXPERIMENTAL
          path: firmware/deye-esp32/dist
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned packaging tools
        shell: pwsh
        run: python -m pip install "pyinstaller==6.16.0" "esptool==4.9.0" "pyserial==3.5"
      - name: Test USB and flash safeguards
        shell: pwsh
        working-directory: tools/windows-flasher
        run: python -m unittest discover -p "test_*.py" -v
      - name: Package one EXE with both JK and VPN factory/update firmwares
        shell: pwsh
        run: |
          python -m PyInstaller --clean --noconfirm --onefile --windowed --name SmartEnergyFlasher --collect-all esptool --hidden-import serial.tools.list_ports --hidden-import voltronic_usb --hidden-import deye_usb --hidden-import jk_usb --hidden-import voltronic_ota_migration --hidden-import jk_usb_guard --add-data "firmware/vpn-gateway/dist/smart-energy-vpn-USB-FACTORY-ESP32-0x0.bin;embedded_firmware" --add-data "firmware/vpn-gateway/dist/smart-energy-vpn-USB-APP-ESP32-0x10000.bin;embedded_firmware" --add-data "firmware/vpn-gateway/dist-s3/smart-energy-vpn-USB-FACTORY-ESP32S3-N16R8-0x0.bin;embedded_firmware" --add-data "firmware/vpn-gateway/dist-s3/smart-energy-vpn-USB-APP-ESP32S3-N16R8-0x10000.bin;embedded_firmware" --add-data "firmware/jk-esp32/dist/smart-jk-esp32-factory.bin;embedded_firmware" --add-data "firmware/jk-esp32/dist/smart-jk-esp32-app-only.bin;embedded_firmware" --add-data "firmware/voltronic-esp32/dist/smart-energy-voltronic-S3-FACTORY-0x0.bin;embedded_firmware" --add-data "firmware/voltronic-esp32/dist/smart-energy-voltronic-S3-APP-0x10000.bin;embedded_firmware" --add-data "firmware/deye-esp32/dist/smart-energy-deye-S3-FACTORY-0x0.bin;embedded_firmware" --add-data "firmware/deye-esp32/dist/smart-energy-deye-S3-APP-0x10000.bin;embedded_firmware" --add-data "firmware/voltronic-esp32/dist-ota/voltronic-s3-ota-bootloader.bin;embedded_firmware" --add-data "firmware/voltronic-esp32/dist-ota/voltronic-s3-ota-partition-table.bin;embedded_firmware" --add-data "firmware/voltronic-esp32/dist-ota/voltronic-s3-ota-app.bin;embedded_firmware" tools/windows-flasher/smart_energy_flasher.py
          if ((Get-Item "dist/SmartEnergyFlasher.exe").Length -lt 3000000) { throw "All-in-one Windows EXE suspiciously small" }
      - name: Upload all-in-one Windows flasher
        uses: actions/upload-artifact@v4
        with:
          name: SmartEnergyFlasher-Windows-AllInOne-JK-VPN
          path: dist/SmartEnergyFlasher.exe
          retention-days: 30
