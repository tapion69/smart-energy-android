name: Publish Windows flasher 0.3.14 as public GitHub Release
on:
  push:
    branches: ['fix/vpn-usb-ota-bootstrap-20261120']
    paths:
      - '.github/workflows/publish-flasher-vpn-bootstrap-0314.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    name: Publish exact tested EXE as downloadable release asset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact successful Windows build and source revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api repos/$GITHUB_REPOSITORY/actions/runs/44785779511 --jq '.conclusion')" = success
          test "$(gh api repos/$GITHUB_REPOSITORY/actions/runs/44785779511 --jq '.head_sha')" = e3630a04e56f4f6def202adbe8aa3b69129f4b3f
          test "$(gh api repos/$GITHUB_REPOSITORY/actions/jobs/136460137774 --jq '.conclusion')" = success
          # Verify the artifact hasn't expired or been replaced.
          test "$(gh api repos/$GITHUB_REPOSITORY/actions/artifacts/14654835978 --jq '.expired')" = false
          test "$(gh api repos/$GITHUB_REPOSITORY/actions/artifacts/14654835978 --jq '.name')" = SmartEnergyFlasher-VPN-OTA-BOOTSTRAP-0.3.14-Windows
      - name: Download original Windows executable built by tested workflow
        uses: actions/download-artifact@v4
        with:
          run-id: 44785779511
          repository: tapion69/smart-energy-android
          github-token: ${{ github.token }}
          name: SmartEnergyFlasher-VPN-OTA-BOOTSTRAP-0.3.14-Windows
          path: release-files
      - name: Validate Windows PE binary and publish stable URL
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path('release-files/SmartEnergyFlasher.exe')
          assert p.is_file(),'Compiled Windows EXE missing from artifact'
          assert p.stat().st_size>10_000_000,'EXE unexpectedly small'
          with p.open('rb') as f:
              assert f.read(2)==b'MZ','Not a Windows PE executable'
          print('Windows EXE: %d bytes'%p.stat().st_size)
          print('SHA256:',hashlib.sha256(p.read_bytes()).hexdigest())
          PY
          TAG=flasher-vpn-ota-bootstrap-v0.3.14
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release already exists; refusing to replace the executable"
            exit 1
          fi
          gh release create "$TAG" release-files/SmartEnergyFlasher.exe \
            --repo "$GITHUB_REPOSITORY" \
            --target e3630a04e56f4f6def202adbe8aa3b69129f4b3f \
            --title "Smart Energy Flasher Windows — VPN OTA bootstrap 0.3.14" \
            --notes "Direct standalone SmartEnergyFlasher.exe download (no GitHub Actions login required). Contains offline precompiled firmware for JK, VPN 0.3.14 (ESP32-S3), Voltronic 0.3.8, and Deye, plus strictly gated VPN-S3 one-time OTA USB migration. **For already provisioned VPN S3, choose VPN > ESP32-S3 N16R8 > Préparer OTA VPN (USB + sauvegarde NVS)**, not FACTORY. The migration first checks the currently installed partition table and verifies a private local backup of the existing NVS, application and bootloader, and fails closed on unknown/already-OTA layouts. This EXE is compiled and tested in CI but not validated on your physical ESP32. Never share private NVS backups."
          echo "RELEASE_URL=https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"
          echo "DOWNLOAD_URL=https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/SmartEnergyFlasher.exe"
