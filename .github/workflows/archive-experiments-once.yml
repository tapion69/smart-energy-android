name: One-time archive and cleanup obsolete development branches
on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/archive-experiments-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  archive-before-deleting:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Archive every historical branch tip before deletion
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branches=(
            experiment/esp32-vpn-gateway
            experiment/smart-energy-v0.3.0-multibms
            experiment/smart-energy-v0.3.2-multibms-diagnostic
            experiment/smart-energy-v0.3.3-ble-gap-recovery
            experiment/smart-energy-v0.3.3-ble-shared-discovery
            experiment/smart-energy-v0.3.4-shared-gap-recovery
            experiment/smart-energy-v0.3.5-single-ble-manager
            experiment/smart-energy-v0.3.6-totals-write-diagnostics
            experiment/smart-energy-v0.3.7-full-parameter-editor
            experiment/smart-energy-v0.3.8-ble-link-stability
            experiment/smart-energy-v0.3.9-vpn-route-fix
            experiment/smart-energy-v0.3.10-bms-selection
            experiment/smart-energy-v0.3.11-ble-stall-recovery
          )
          declare -A saved
          echo 'Phase 1: archive and verify EVERY branch before deleting any'
          for branch in "${branches[@]}"; do
            if ! git ls-remote --exit-code --heads origin "refs/heads/$branch" >/dev/null; then
              echo "Already absent: $branch"; continue
            fi
            git fetch --no-tags origin "refs/heads/$branch:refs/remotes/origin/$branch"
            sha="$(git rev-parse "refs/remotes/origin/$branch")"
            tag="archive/2026-11-09/${branch#experiment/}"
            if ! git show-ref --verify --quiet "refs/tags/$tag"; then git tag "$tag" "$sha"; fi
            git push origin "refs/tags/$tag:refs/tags/$tag"
            remote_tag="$(git ls-remote --tags origin "refs/tags/$tag" | awk '{print $1}')"
            test "$remote_tag" = "$sha" || { echo "Archival failed. NO deletion."; exit 1; }
            saved["$branch"]="$sha"
            echo "Archived $branch"
          done
          echo 'Phase 2: delete unchanged, archived branch refs only'
          for branch in "${branches[@]}"; do
            if [[ -z "${saved[$branch]:-}" ]]; then continue; fi
            remote_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$branch" --jq '.object.sha')"
            if [[ "$remote_sha" != "${saved[$branch]}" ]]; then
              echo "SKIP changed branch $branch"; continue
            fi
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch"
            echo "Deleted $branch"
          done
          echo 'Remaining branch heads:'
          git ls-remote --heads origin
