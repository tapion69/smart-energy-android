name: Publish signed Android 0.3.45 and Voltronic S3 OTA 0.3.5

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/release-android-0345-voltronic-035.yml'
      - 'firmware/voltronic-esp32/tests/test_ota_preflight_sources.py'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: smart-energy-signed-0345-and-voltronic-035
  cancel-in-progress: false

jobs:
  android:
    name: Compile tested permanently signed Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Embed unchanged SHA256-pinned S3 0.3.4 test image
        uses: actions/download-artifact@v4
        with:
          name: SmartEnergy-VOLTRONIC-S3-OTA-0.3.3-PREFLIGHT
          run-id: 43585410799
          repository: tapion69/smart-energy-android
          github-token: ${{ github.token }}
          path: android/app/src/main/assets
      - name: Verify unchanged embedded firmware
        shell: bash
        run: |
          set -euo pipefail
          cd android/app/src/main/assets
          echo '9cfc8c87280c50bf92eb4f6b8029ea67004aa79cfbe7ff0faa0f24f78e3bf289  smart-energy-voltronic-S3-OTA.bin' | sha256sum -c -
          test "$(wc -c < smart-energy-voltronic-S3-OTA.bin)" -eq 901664
          mv smart-energy-voltronic-S3-OTA.bin voltronic-s3-0.3.4-test.bin
      - name: Configure existing permanent Android signer
        shell: bash
        env:
          SE_KEYSTORE_B64: ${{ secrets.SMART_ENERGY_ANDROID_KEYSTORE_BASE64 }}
          SE_STORE_PASSWORD: ${{ secrets.SMART_ENERGY_ANDROID_STORE_PASSWORD }}
          SE_KEY_ALIAS: ${{ secrets.SMART_ENERGY_ANDROID_KEY_ALIAS }}
          SE_KEY_PASSWORD: ${{ secrets.SMART_ENERGY_ANDROID_KEY_PASSWORD }}
          TRUSTED_CERT: ${{ secrets.SMART_ENERGY_ANDROID_CERT_SHA256 }}
        run: |
          set -euo pipefail
          test -n "$SE_KEYSTORE_B64" && test -n "$SE_STORE_PASSWORD"
          test -n "$SE_KEY_ALIAS" && test -n "$SE_KEY_PASSWORD"
          [[ "$TRUSTED_CERT" =~ ^[a-fA-F0-9]{64}$ ]]
          printf '%s' "$SE_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/smart-energy-android-release.jks"
          chmod 600 "$RUNNER_TEMP/smart-energy-android-release.jks"
          echo "SMART_ENERGY_ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/smart-energy-android-release.jks" >> "$GITHUB_ENV"
          echo "SMART_ENERGY_ANDROID_STORE_PASSWORD=$SE_STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "SMART_ENERGY_ANDROID_KEY_ALIAS=$SE_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "SMART_ENERGY_ANDROID_KEY_PASSWORD=$SE_KEY_PASSWORD" >> "$GITHUB_ENV"
      - name: Android unit tests and signed release compilation
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon testDebugUnitTest assembleRelease
      - name: Verify Android identity, fixed 0.3.4 bundle and original signature
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TRUSTED_CERT: ${{ secrets.SMART_ENERGY_ANDROID_CERT_SHA256 }}
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          "$APKSIGNER" verify --verbose "$APK"
          "$AAPT" dump badging "$APK" > /tmp/new-apk-badging
          grep -q "name='fr.smartenergy.android'" /tmp/new-apk-badging
          grep -q "versionCode='59'" /tmp/new-apk-badging
          grep -q "versionName='0.3.45-dev'" /tmp/new-apk-badging
          test "$(unzip -p "$APK" assets/voltronic-s3-0.3.4-test.bin | sha256sum | awk '{print $1}')" = 9cfc8c87280c50bf92eb4f6b8029ea67004aa79cfbe7ff0faa0f24f78e3bf289
          mkdir -p previous
          gh release download android-v0.3.44-test -R "$GITHUB_REPOSITORY" --pattern SmartEnergy-Android-0.3.44.apk --dir previous
          OLD=previous/SmartEnergy-Android-0.3.44.apk
          printf '2d3a533719ad64aa640a37011d919e22f1b179514ee37dad1c3497e9bf164683  %s\n' "$OLD" | sha256sum -c -
          "$APKSIGNER" verify "$OLD"
          get_cert() {
            "$APKSIGNER" verify --print-certs "$1" |
              grep -Eio '([[:xdigit:]]{2}:){31}[[:xdigit:]]{2}|[[:xdigit:]]{64}' |
              head -n 1 | tr -d ':' | tr '[:upper:]' '[:lower:]'
          }
          CURRENT=$(get_cert "$OLD")
          NEW=$(get_cert "$APK")
          TRUSTED=$(printf '%s' "$TRUSTED_CERT" | tr '[:upper:]' '[:lower:]')
          [[ "$CURRENT" =~ ^[a-f0-9]{64}$ && "$NEW" =~ ^[a-f0-9]{64}$ ]]
          test "$CURRENT" = "$NEW" && test "$NEW" = "$TRUSTED"
          echo "Verified: 0.3.45-dev code 59, original APK certificate preserved."
      - uses: actions/upload-artifact@v4
        with:
          name: smart-energy-android-official-0345-signed
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

  voltronic:
    name: Compile and validate S3 dual-OTA application 0.3.5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Host parser, semantic write and OTA safety regression tests
        shell: bash
        run: |
          set -euo pipefail
          gcc -std=gnu11 -Wall -Wextra -Werror firmware/voltronic-esp32/tests/test_protocol.c -o /tmp/se-s3-protocol -lm
          /tmp/se-s3-protocol
          gcc -std=gnu11 -Wall -Wextra -Werror firmware/voltronic-esp32/tests/test_edit.c -o /tmp/se-s3-edit -lm
          /tmp/se-s3-edit
          python firmware/voltronic-esp32/tests/test_ota_preflight_sources.py
          grep -Fq '#define VT_VERSION "0.3.5"' firmware/voltronic-esp32/main/main.c
      - name: Select existing two-partition S3 N16R8 OTA configuration
        shell: bash
        run: |
          set -euo pipefail
          cp firmware/voltronic-esp32/sdkconfig.ota.defaults firmware/voltronic-esp32/sdkconfig
          grep -q '^CONFIG_PARTITION_TABLE_CUSTOM=y' firmware/voltronic-esp32/sdkconfig
          grep -q '^CONFIG_BOOTLOADER_APP_ROLLBACK_ENABLE=y' firmware/voltronic-esp32/sdkconfig
      - name: ESP-IDF 5.3.2 OTA application build
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.3.2
          target: esp32s3
          path: firmware/voltronic-esp32
          command: idf.py -B build_ota build
      - name: Validate target, actual dual OTA layout, firmware image header
        shell: bash
        run: |
          set -euo pipefail
          FW=firmware/voltronic-esp32/build_ota/smart_energy_voltronic_s3.bin
          test -s "$FW"
          grep -q '^CONFIG_IDF_TARGET_ESP32S3=y' firmware/voltronic-esp32/build_ota/config/sdkconfig.h || true
          grep -q 'CONFIG_PARTITION_TABLE_CUSTOM=y' firmware/voltronic-esp32/build_ota/sdkconfig
          test -s firmware/voltronic-esp32/build_ota/partition_table/partition-table.bin
          python - <<'PY'
          from pathlib import Path
          p=Path('firmware/voltronic-esp32/build_ota/smart_energy_voltronic_s3.bin')
          d=p.read_bytes()
          assert 16384<=len(d)<=2097152,(len(d),'invalid OTA partition size')
          assert d[0]==0xe9 and int.from_bytes(d[12:14],'little')==9,'not ESP32-S3'
          csv=Path('firmware/voltronic-esp32/partitions_ota.csv').read_text()
          assert 'ota_0,app,ota_0,0x210000,0x200000' in csv
          assert 'ota_1,app,ota_1,0x410000,0x200000' in csv
          assert 'nvs,data,nvs,0x9000,0x6000' in csv
          print('S3 OTA application verified:',len(d),'bytes')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: smart-energy-voltronic-s3-ota-035
          path: firmware/voltronic-esp32/build_ota/smart_energy_voltronic_s3.bin
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish verified APK and OTA, then activate the official update checks
    needs: [android, voltronic]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: official
          fetch-depth: 1
          persist-credentials: true
      - uses: actions/download-artifact@v4
        with:
          name: smart-energy-android-official-0345-signed
          path: release-files/android
      - uses: actions/download-artifact@v4
        with:
          name: smart-energy-voltronic-s3-ota-035
          path: release-files/voltronic
      - name: Re-verify identities before public release
        shell: bash
        env:
          TRUSTED_CERT: ${{ secrets.SMART_ENERGY_ANDROID_CERT_SHA256 }}
        run: |
          set -euo pipefail
          mkdir -p release-files/final
          cp release-files/android/app-release.apk release-files/final/SmartEnergy-Android.apk
          cp release-files/voltronic/smart_energy_voltronic_s3.bin release-files/final/smart-energy-voltronic-S3-OTA.bin
          APK=release-files/final/SmartEnergy-Android.apk
          FW=release-files/final/smart-energy-voltronic-S3-OTA.bin
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)
          "$APKSIGNER" verify "$APK"
          CERT=$("$APKSIGNER" verify --print-certs "$APK" | grep -Eio '([[:xdigit:]]{2}:){31}[[:xdigit:]]{2}|[[:xdigit:]]{64}' | head -n 1 | tr '[:upper:]' '[:lower:]')
          EXPECTED=$(printf '%s' "$TRUSTED_CERT" | tr '[:upper:]' '[:lower:]')
          [[ "$CERT" =~ ^[a-f0-9]{64}$ ]] && test "$CERT" = "$EXPECTED"
          "$AAPT" dump badging "$APK" > /tmp/verified-package
          grep -q "name='fr.smartenergy.android'" /tmp/verified-package
          grep -q "versionCode='59'" /tmp/verified-package
          grep -q "versionName='0.3.45-dev'" /tmp/verified-package
          python - <<'PY'
          from pathlib import Path
          f=Path('release-files/final/smart-energy-voltronic-S3-OTA.bin').read_bytes()
          assert 16384<=len(f)<=2097152 and f[0]==0xe9
          assert int.from_bytes(f[12:14],'little')==9
          print('Official firmware verified:',len(f),'bytes')
          PY
          sha256sum "$APK" "$FW" > release-files/final/SHA256SUMS.txt
          cat release-files/final/SHA256SUMS.txt
      - name: Publish immutable GitHub releases for user installation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          R="$GITHUB_REPOSITORY"
          FWTAG=voltronic-v0.3.5
          APKTAG=android-v0.3.45-dev
          ! gh release view "$FWTAG" -R "$R" >/dev/null 2>&1
          ! gh release view "$APKTAG" -R "$R" >/dev/null 2>&1
          gh release create "$FWTAG" release-files/final/smart-energy-voltronic-S3-OTA.bin \
            -R "$R" --target "$GITHUB_SHA" --prerelease \
            --title "Voltronic ESP32-S3 0.3.5 — native MPPT1 OTA" \
            --notes "ESP32-S3 N16R8 dual-OTA application only (not factory/USB image). Fix native PV1 QPIGS index learning 19/20/18/17/16 and nighttime retention. Existing Wi-Fi, code, dual OTA and JK/VPN stay untouched. User-confirmed local Wi-Fi OTA only; SHA-256 is verified by Android and ESP-IDF. Do not interrupt S3 power."
          gh release create "$APKTAG" release-files/final/SmartEnergy-Android.apk \
            -R "$R" --target "$GITHUB_SHA" --prerelease \
            --title "Smart Energy Android 0.3.45 — dashboards corrected + Voltronic OTA" \
            --notes "Android fr.smartenergy.android, signed with the SAME permanent certificate as 0.3.44, versionCode 59. Installs over 0.3.44 without uninstalling or losing settings. Modern/Sunsynk measurements INSIDE existing diagram blocks; true inverter/home positions; native MPPT1 provenance; battery flows directional and zero-W pauses. Voltronic 0.3.5 selectable OTA from Updates on Wi-Fi local. JK dashboard, JK/VPN firmware and profiles untouched."
      - name: Publish GitHub manifest versions in main for in-app update checks
        shell: bash
        run: |
          set -euo pipefail
          cd official
          python -m unittest discover -s tools/releases -p 'test_*.py'
          python tools/releases/publish_update_manifest.py \
            --tag android-v0.3.45-dev \
            --asset ../release-files/final/SmartEnergy-Android.apk \
            --version 0.3.45-dev --version-code 59
          python tools/releases/publish_update_manifest.py \
            --tag voltronic-v0.3.5 \
            --asset ../release-files/final/smart-energy-voltronic-S3-OTA.bin \
            --version 0.3.5
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add updates/android.json updates/voltronic-esp32.json
          git diff --cached --quiet && { echo 'No newer manifest produced'; exit 1; }
          git commit -m 'chore(updates): publish signed Android 0.3.45 and S3 OTA 0.3.5'
          git pull --rebase origin main
          git push origin HEAD:main
          echo 'Both verified releases published and in-app update feeds activated.'
