name: Smart Energy Flasher source regression tests

on:
  push:
    branches: [dev]
    paths:
      - 'tools/windows-flasher/**'
      - '.github/workflows/build-windows-flasher.yml'
  workflow_dispatch:

permissions:
  contents: read

# Only the build-vpn-gateway workflow produces the recommended EXE.
# Do not publish an old executable missing bundled JK/VPN binaries.
jobs:
  windows-tests:
    name: Windows tests (EXE available from all-in-one workflow)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned test dependencies
        shell: pwsh
        run: python -m pip install "pyserial==3.5"
      - name: Verify flash modes, COM dropdown and frozen app streams
        shell: pwsh
        working-directory: tools/windows-flasher
        run: python -m unittest discover -p "test_*.py" -v
